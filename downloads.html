<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Downloads - Learning Malagasy with Bako</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,700;0,6..12,800;1,6..12,400&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/6179a34789.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" type="text/css" href="/styles.css">
  <link rel="stylesheet" type="text/css" href="/page.css">
  <style>
    .pdf-group {
      margin-bottom: 2rem;
    }

    .pdf-group h2 {
      margin: 0 0 12px;
      font-size: 1.3rem;
      font-weight: 800;
    }

    .pdf-group.intro h2   { color: #24302d; }
    .pdf-group.grammar h2 { color: #b3261e; }
    .pdf-group.themes h2  { color: #2e7d4f; }

    .pdf-list {
      margin: 0;
      padding: 0;
      list-style: none;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #dce4e1;
      overflow: hidden;
    }

    .pdf-list li + li {
      border-top: 1px solid #e8eeec;
    }

    .page-main .pdf-list a {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 52px;
      padding: 10px 18px;
      color: #24302d;
      font-weight: 600;
      text-decoration: none;
    }

    .page-main .pdf-list a:hover {
      background: #f2f7f5;
    }

    .pdf-list i {
      flex: none;
      font-size: 1.2rem;
      color: #b3261e;
    }

    .pdf-list .dl {
      margin-left: auto;
      color: #66726f;
      font-size: 0.9rem;
      font-weight: 700;
    }
  </style>
</head>
<body class="page">
  <div id="header"></div>

  <main class="page-main">
    <h1 class="page-title">Lesson Downloads</h1>
    <p class="page-lead">Download all the lesson PDFs here.</p>

    <!-- Placeholder for the dynamically loaded PDF links -->
    <div id="pdf-list"></div>
  </main>

  <div id="footer"></div>

  <script src="/script.js?v=7" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Same colours as the track cards on the home page
      const groupClass = {
        "Introductory Lessons": "intro",
        "Grammar Lessons": "grammar",
        "Thematic Lessons": "themes"
      };

      fetch("lessons.json")
        .then(response => response.json())
        .then(data => {
          const pdfList = document.getElementById("pdf-list");

          data.lessons.forEach(category => {
            const group = document.createElement("section");
            group.className = "pdf-group " + (groupClass[category.category] || "");

            const categoryTitle = document.createElement("h2");
            categoryTitle.textContent = category.category;
            group.appendChild(categoryTitle);

            const list = document.createElement("ul");
            list.className = "pdf-list";

            category.links.forEach(lesson => {
              const pdfUrl = lesson.url; // PDF URL stored in JSON

              // Ensure only PDF links are added
              if (pdfUrl.endsWith(".pdf")) {
                const listItem = document.createElement("li");

                const link = document.createElement("a");
                link.href = pdfUrl;
                link.target = "_blank"; // Opens in new tab

                const icon = document.createElement("i");
                icon.className = "fa-solid fa-file-pdf";
                icon.setAttribute("aria-hidden", "true");

                const title = document.createElement("span");
                title.textContent = lesson.title;

                const dl = document.createElement("span");
                dl.className = "dl";
                dl.textContent = "PDF";

                link.append(icon, title, dl);
                listItem.appendChild(link);
                list.appendChild(listItem);
              }
            });

            group.appendChild(list);
            pdfList.appendChild(group);
          });
        })
        .catch(error => console.error("Error loading PDFs:", error));
    });
  </script>
</body>
</html>
